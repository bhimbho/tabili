[package]
name = "tabili"
version = "0.1.0"
description = "tabili — a native database client"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tabili_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
async-trait = "0.1.92"
keyring = { version = "4.1.6", features = ["apple-native-keyring-store", "v1"], default-features = false }
sqlparser = "0.62.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "chrono", "uuid", "json", "rust_decimal"] }
specta-typescript = "0.0.12"
specta = { version = "2.0.0-rc.25", features = ["derive", "serde_json"] }
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "typescript"] }
tauri-plugin-dialog = "2.7.2"
base64 = "0.23.1"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
chrono = "0.4.45"
rust_decimal = "1.42.1"
window-vibrancy = "0.8.0"
russh = "0.62.6"

